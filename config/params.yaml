# Pipeline parameters. Scripts read every tunable value from here; nothing below is hardcoded elsewhere.
# Values marked "initial" are starting choices to be reviewed in the phase that uses them.

crs:
  working: "EPSG:25833"   # ETRS89 / UTM zone 33N, used for all metric operations
  geographic: "EPSG:4326" # used only for Earth Engine exchange and web outputs

election:
  name: "Wahl zum Abgeordnetenhaus von Berlin"
  date: "2026-09-20"
  vote: "Zweitstimme"

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  figures: "figures"
  manifest: "data/raw/manifest.csv"

# Sources fetched by src/download.py. Direct URLs were resolved and inspected in Phase 1.
# licence_as_stated is copied verbatim from the provider; licence_where says where it was read.
sources:
  election_results:
    landing_page: "https://www.wahlen-berlin.de/wahlen/BE2026/Afspraes/AGH/downloads.html"
    licence_as_stated: "CC BY 3.0 DE"
    licence_where: "Field 'Lizenz' in DSB_Datenexport_AGH2026_Zweitstimme_W_BE.csv"
    files:
      results_w: "https://www.wahlen-berlin.de/wahlen/BE2026/Afspraes/AGH/Datenexport_AGH2026_Zweitstimme_W_BE.csv"
      results_w_dsb: "https://www.wahlen-berlin.de/wahlen/BE2026/Afspraes/AGH/DSB/DSB_Datenexport_AGH2026_Zweitstimme_W_BE.csv"
      results_a: "https://www.wahlen-berlin.de/wahlen/BE2026/Afspraes/AGH/Datenexport_AGH2026_Zweitstimme_A_BE.csv"
      results_a_dsb: "https://www.wahlen-berlin.de/wahlen/BE2026/Afspraes/AGH/DSB/DSB_Datenexport_AGH2026_Zweitstimme_A_BE.csv"
  district_geometries:
    landing_page: "https://daten.berlin.de/datensaetze/geometrien-der-wahlbezirke-fur-die-wahl-zum-20-abgeordnetenhaus-von-berlin-und-bvv-2026"
    licence_as_stated: "Der Datenbestand wird unter der Lizenz CC-BY-3.0-Namensnennung veröffentlicht (vgl. https://creativecommons.org/licenses/by/3.0/de/). Als Urheber ist dabei zu nennen: Amt für Statistik Berlin-Brandenburg 2026."
    licence_where: "RBS_OD_Wahlgebiete_AH2026_Beschreibung.pdf, section 'Lizenz / Veröffentlichungshinweise' (daten.berlin.de shows only 'Creative Commons Attribution (cc-by)')"
    # These URLs return an HTML web app page to scripts; browsers then fetch the file from
    # cdn0.scrvt.com. Hashes are pinned from the browser downloads of 2026-10-03.
    files:
      geometries_uwb:
        url: "https://www.statistik-berlin-brandenburg.de/opendata/RBS_OD_UWB_AH26.zip"
        sha256: "d807a17fb634f8d382aec5996cade1ae510086814ed329865e6a6901cbd75371"
      geometries_doc:
        url: "https://www.statistik-berlin-brandenburg.de/opendata/RBS_OD_Wahlgebiete_AH2026_Beschreibung.pdf"
        sha256: "9e40a1fa8397d585b8bff2bee4275c969ebdcbef30c815052c750322c9bfad9d"
  population_density:
    landing_page: "https://daten.berlin.de/datensaetze/einwohnerdichte-2025-umweltatlas-wfs-b2654f6b"
    licence_as_stated: "Der Datenbestand wird unter der Lizenz CC-BY-3.0-Namensnennung veröffentlicht (vgl. https://creativecommons.org/licenses/by/3.0/de/). Der Quellenvermerk gemäß Abschnitt 3a der Lizenz lautet \"Amt für Statistik Berlin-Brandenburg / Einwohnerdichte 2025 (Umweltatlas)\"."
    licence_where: "WFS GetCapabilities, ows:AccessConstraints"
    files:
      # Single request: the server's CountDefault (1,000,000) exceeds the 26,613 features.
      population_blocks: "https://gdi.berlin.de/services/wfs/ua_einwohnerdichte_2025?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=ua_einwohnerdichte_2025:ua_einwohnerdichte_2025"
      population_capabilities: "https://gdi.berlin.de/services/wfs/ua_einwohnerdichte_2025?SERVICE=WFS&REQUEST=GetCapabilities"
  osm:
    landing_page: "https://download.geofabrik.de/europe/germany/berlin.html"
    licence_as_stated: "License: ODbL 1.0. Data processed by Geofabrik GmbH and created by OpenStreetMap Contributors"
    licence_where: "Geofabrik Berlin download page, footer and attribution note"
    # Geofabrik keeps daily dated files only for a few days, so the unmodified extract
    # berlin-261003.osm.pbf (replication timestamp 2026-10-03T20:20:50Z) is mirrored as an asset
    # of this repository's release osm-berlin-2026-10-03 and pinned by hash.
    origin_url: "https://download.geofabrik.de/europe/germany/berlin-261003.osm.pbf"
    files:
      osm_extract:
        url: "https://github.com/giovanigoltara/Berlin_Wahl_Analysis/releases/download/osm-berlin-2026-10-03/berlin-261003.osm.1.pbf"
        sha256: "732546ad128dea41ebd68c26b9c52c845baa7f2b50cd9816dd193604bb3c20f0"

imagery:
  years: [2023, 2024, 2025]
  season_start: "06-01"   # inclusive, month-day
  season_end: "09-01"     # exclusive, so June to August
  composite: "median"
  landsat:
    collections:
      - "LANDSAT/LC08/C02/T1_L2"
      - "LANDSAT/LC09/C02/T1_L2"
    band: "ST_B10"
    # Collection 2 Level 2 surface temperature scaling (USGS): K = DN * scale + offset
    st_scale: 0.00341802
    st_offset: 149.0
    max_scene_cloud_cover: 30  # initial; percent, applied to CLOUD_COVER property
    # QA_PIXEL bits masked: 1 dilated cloud, 2 cirrus, 3 cloud, 4 cloud shadow
    qa_mask_bits: [1, 2, 3, 4]
    scale_m: 30
  sentinel2:
    collection: "COPERNICUS/S2_SR_HARMONIZED"
    cloud_score_collection: "GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED"
    cloud_score_band: "cs_cdf"
    clear_threshold: 0.60     # initial; pixels with cs_cdf below this are masked
    nir_band: "B8"
    red_band: "B4"
    scale_m: 10

# Dasymetric step (sql/30_dasymetric.sql), passed to SQL as hgv.<name> settings.
dasymetric:
  min_block_residents: 1  # blocks with fewer residents are not residential land
  min_piece_m2: 1.0       # block-district intersections smaller than this are boundary slivers
  # Block types (field typklar, exact strings) never counted as residential land: open land and
  # transport or utility infrastructure, where registered residents are caretaker flats or
  # register artefacts. Residents there still count in district totals.
  excluded_block_types:
    - "Wald"
    - "Gewässer"
    - "Landwirtschaft"
    - "Brachfläche"
    - "Baustelle"
    - "Park / Grünfläche"
    - "Friedhof"
    - "Stadtplatz / Promenade"
    - "Kleingartenanlage"
    - "Wochenendhaus- und kleingartenähnliches Gebiet"
    - "Baumschule / Gartenbau"
    - "Campingplatz"
    - "Sportanlage, ungedeckt"
    - "Sportanlage, gedeckt"
    - "Parkplatz"
    - "Gleiskörper"
    - "Bahnhof und Bahnanlagen ohne Gleiskörper"
    - "sonstige Verkehrsfläche"
    - "Ver- und Entsorgung"
  # Station districts allowed to have no residential land. Both lie on a Spandau site that the
  # 2025 blocks show as industrial land (0 and 13 residents), while the 2026 register lists 104
  # and 85 eligible voters: housing occupied after the population snapshot. Any other district
  # without residential land fails the run.
  known_no_residential_land: ["05334", "05335"]

# OSM accessibility (src/osm_extract.py, sql/40_accessibility.sql). Scalars and the category
# names are passed to SQL as hgv.<name> settings.
accessibility:
  method: "euclidean_buffer"
  buffer_m: 500
  # Features tagged access=<value> are not public and are dropped (e.g. playgrounds in
  # private courtyards).
  exclude_access: ["private", "no"]
  # Category: OSM key -> accepted values. A feature belongs to a category if any key matches.
  # Points (nodes) and areas (closed ways, multipolygon relations) are both used; distance is
  # measured to the area edge. Counts in the 2026-10-03 extract are in docs/methods.md.
  amenities:
    schools:
      amenity: ["school"]
    kindergartens:
      amenity: ["kindergarten"]
    health:  # general practice and pharmacy; dentists, therapists, alternative medicine excluded
      amenity: ["doctors", "clinic", "hospital", "pharmacy"]
      healthcare: ["doctor", "clinic", "hospital", "pharmacy", "centre"]
    supermarkets:
      shop: ["supermarket"]
    public_transport_stops:  # boarding points; stop_position and platform would duplicate them
      highway: ["bus_stop"]
      railway: ["station", "halt", "tram_stop"]
      public_transport: ["station"]
    parks:
      leisure: ["park"]
    playgrounds:
      leisure: ["playground"]

analysis:
  correlation: "spearman"
  moran_weights: "queen"
  moran_permutations: 999
  random_seed: 20260920
