[project]
name = "heat-green-vote-berlin"
version = "0.1.0"
description = "Surface temperature, vegetation, service access and Zweitstimme results across Berlin's electoral districts, Abgeordnetenhaus election 2026."
readme = "README.md"
license = "MIT"
authors = [{ name = "Giovani Bonadiman Goltara" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "earthengine-api==1.7.46",
    "esda==2.9.0",
    "frictionless==5.19.1",
    "geoalchemy2==0.20.0",
    "geopandas==1.2.0",
    "libpysal==4.14.1",
    "mapclassify==2.10.0",
    "matplotlib==3.11.2",
    "matplotlib-scalebar==0.9.0",
    "osmnx==2.1.1",
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "pyogrio==0.13.0",
    "pyproj==3.7.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "shapely==2.1.2",
    "sqlalchemy==2.1.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
